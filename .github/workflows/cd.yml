name: CD

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

concurrency:
  group: cd-infra-k8s
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_new_relic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
      - name: Garante bucket do state Terraform
        run: |
          BUCKET=tc-fiap-oficina-tfstate-512135631497
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region us-east-1
            aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled
          fi
      - run: terraform init -input=false
      # Etapa 1: cluster e nodes antes dos providers kubernetes/helm (necessário
      # quando o state está vazio, ex.: conta do lab recriada). Sem mudanças
      # quando o cluster já existe.
      - name: Apply do cluster (etapa 1)
        run: terraform apply -auto-approve -input=false -target=aws_eks_node_group.main
      - name: Apply completo (etapa 2)
        run: terraform apply -auto-approve -input=false
